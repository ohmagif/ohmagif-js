name: ci

# Every gate runs on every push and pull request, and once a week as well:
# the integration and browser suites talk to the live API, which changes
# without a commit here. A push to main puts the example on GitHub Pages, and
# a version tag (v1.2.0) publishes the package to npm.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '30 6 * * 6'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - &setup-node
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
      - run: make install
      - run: make lint

  # Gated at 100%: every statement, branch, function and line.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *setup-node
      - run: make install
      - run: make test
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      # Coveralls hosts the coverage history and comments on pull requests. Runs even when tests
      # failed, so a coverage drop is still visible.
      - name: Upload coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          format: lcov

  # The client against the live API: its answers still have the shape the
  # package reads.
  test-integration:
    runs-on: ubuntu-latest
    env: &api-key
      # The example's key: works from ohmagif.github.io and localhost:8082
      # and 8083, and from the tests' own code.
      OHMAGIF_API_KEY: ${{ secrets.OHMAGIF_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - *setup-node
      - run: make install
      - run: make test-integration

  # Playwright on the example, built as Pages serves it, against the live API.
  e2e:
    runs-on: ubuntu-latest
    env: *api-key
    steps:
      - uses: actions/checkout@v7
      - *setup-node
      - run: make install
      - run: npx playwright install --with-deps chromium
      - run: make e2e-ci
      # What each step did and saw, for a failure the log does not explain.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: test-results

  # The package as it would be published: dist/ built from the sources and
  # nothing else in it.
  build:
    needs: [lint, test, test-integration, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *setup-node
      - run: make install
      - run: make build
      - run: npm pack --dry-run

  # The example at https://ohmagif.github.io/ohmagif-js/, served from the
  # gh-pages branch, which also holds each pull request's preview under
  # pr-preview/ (preview.yml).
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env: *api-key
    permissions:
      contents: write
    concurrency:
      group: pages-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - *setup-node
      - run: make install
      - run: make example-build
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: examples/dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
          commit-message: Example of ${{ github.sha }}

  # Trusted publishing: npm takes this job's word for it that the package
  # comes from this repository and workflow file, without a token.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          registry-url: https://registry.npmjs.org
      - run: make install
      # The tag is the version: v1.2.0 publishes 1.2.0. A tag that is not a
      # version stops here.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: make publish
